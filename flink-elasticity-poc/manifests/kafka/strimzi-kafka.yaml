apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka
  namespace: kafka
spec:
  kafka:
    version: 3.8.0
    replicas: 1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      process.roles: broker,controller
      node.id: 0
      controller.quorum.voters: 0@kafka-kafka-0.kafka-kafka-brokers.kafka.svc:9093
      listener.security.protocol.map: CONTROLLER:PLAINTEXT,REPLICATION:PLAINTEXT,PLAIN:PLAINTEXT
      inter.broker.listener.name: PLAIN
      controller.listener.names: CONTROLLER
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: false
      num.partitions: 12
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1
        memory: 1Gi
    storage:
      type: persistent-claim
      size: 8Gi
      deleteClaim: false
      class: standard
    template:
      pod:
        metadata:
          labels:
            app: kafka
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: events-in
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 12
  replicas: 1
  config:
    retention.ms: 86400000
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: events-out
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 6
  replicas: 1
  config:
    retention.ms: 86400000
