apiVersion: v1
kind: Namespace
metadata:
  name: kafka
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-fallback-config
  namespace: kafka
data:
  KAFKA_NODE_ID: "1"
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
  KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-0.kafka.kafka.svc.cluster.local:9092"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-0.kafka.kafka.svc.cluster.local:9093"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
  KAFKA_NUM_PARTITIONS: "12"
  KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: kafka-fallback-config
          env:
            - name: KAFKA_KRAFT_CLUSTER_ID
              value: 6QfC4v7GSFmdVtI8d2vI6A
          command:
            - /bin/bash
            - -ec
            - |
              cat >/tmp/server.properties <<EOF
              process.roles=${KAFKA_PROCESS_ROLES}
              node.id=${KAFKA_NODE_ID}
              controller.listener.names=${KAFKA_CONTROLLER_LISTENER_NAMES}
              listeners=${KAFKA_LISTENERS}
              advertised.listeners=${KAFKA_ADVERTISED_LISTENERS}
              listener.security.protocol.map=${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
              controller.quorum.voters=${KAFKA_CONTROLLER_QUORUM_VOTERS}
              inter.broker.listener.name=PLAINTEXT
              auto.create.topics.enable=${KAFKA_AUTO_CREATE_TOPICS_ENABLE}
              offsets.topic.replication.factor=${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
              transaction.state.log.replication.factor=${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR}
              transaction.state.log.min.isr=${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR}
              num.partitions=${KAFKA_NUM_PARTITIONS}
              log.dirs=/var/lib/kafka/data
              EOF
              /opt/kafka/bin/kafka-storage.sh format -t "${KAFKA_KRAFT_CLUSTER_ID}" -c /tmp/server.properties --ignore-formatted
              export KAFKA_HEAP_OPTS="${KAFKA_HEAP_OPTS}"
              exec /opt/kafka/bin/kafka-server-start.sh /tmp/server.properties
          ports:
            - containerPort: 9092
              name: kafka
            - containerPort: 9093
              name: controller
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              cpu: 1
              # 1Gi proved too tight in practice: the broker's 512m heap plus the
              # exec'd Kafka CLI JVMs the runbook and console run inside this
              # container OOM-killed the broker under scenario load (S2 at 12k ev/s).
              memory: 1536Mi
          readinessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: kafka
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
    - name: controller
      port: 9093
      targetPort: controller
